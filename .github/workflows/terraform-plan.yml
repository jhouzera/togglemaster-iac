name: terraform-plan

on:
  pull_request:
  workflow_dispatch:
    inputs:
      infra_destroy:
        description: 'Destruir a infraestrutura? (true para destruir)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init sem backend remoto
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: config
          scan-ref: infrastructure/
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: TFLint init
        run: tflint --init
      - name: TFLint run
        run: tflint --recursive --minimum-failure-severity=error

  terraform-plan:
    needs: [terraform-validate, terraform-security]
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/${{ env.TARGET_ENV }}
    env:
      TARGET_ENV: dev
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_togglemaster_gitops_repo_url: ${{ vars.TOGGLEMASTER_GITOPS_REPO_URL }}
      TF_VAR_togglemaster_gitops_branch: ${{ vars.TOGGLEMASTER_GITOPS_BRANCH }}
      TF_VAR_togglemaster_addons_repo_url: ${{ vars.TOGGLEMASTER_ADDONS_REPO_URL }}
      TF_VAR_togglemaster_addons_branch: ${{ vars.TOGGLEMASTER_ADDONS_BRANCH }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v0.67.1/terragrunt_linux_amd64 -o /tmp/terragrunt
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/terragrunt

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Exportar variaveis sensiveis
        run: bash ../../.github/scripts/export-tfvars-env.sh

      - name: Terragrunt plan
        run: |
          if [[ "${{ github.event.inputs.infra_destroy }}" == "true" ]]; then
            terragrunt plan -destroy -out=tfplan
          else
            terragrunt plan -out=tfplan
          fi

      - name: Exportar plano em texto
        run: |
          TERRAGRUNT_FORWARD_TF_STDOUT=true terragrunt show -no-color tfplan > tfplan.txt
          sed -i -e 's/\x1b\[[0-9;]*m//g' -e 's/^.*STDOUT terraform: *//' tfplan.txt
      - name: Publicar artefatos do plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: |
            environments/${{ env.TARGET_ENV }}/tfplan
            environments/${{ env.TARGET_ENV }}/tfplan.txt

      - name: Comentar resumo do plan no PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-dev
          path: environments/${{ env.TARGET_ENV }}/tfplan.txt
